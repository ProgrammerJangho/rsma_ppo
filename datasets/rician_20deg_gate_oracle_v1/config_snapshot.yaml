env:
  num_users: 2
  num_antennas: 2
  alpha: 0.8
  small_scale_model: rician_ula
  rician_k_db: 8.0
  user_angles_deg:
  - -10.0
  - 10.0
  antenna_spacing_wavelength: 0.5
  path_gains_db: null
  csit_error_std: 0.0
  csit_error_mode: relative
  pathloss_model: homogeneous
  user_distances: null
  cell_radius: 500.0
  min_distance: 35.0
  pathloss_exponent: 3.5
  reference_distance: 1.0
  reference_gain_db: 0.0
  shadowing_std_db: 0.0
  beta_normalization: mean_one
  geometry_seed: 0
  user_classes: null
  aoi_weight_mode: explicit
  class_priority: null
  noise_power: 1.0
  snr_db: 10.0
  p_max: null
  blocklength: 128
  payload_bits: 256.0
  private_beam: rzf
  common_beam: principal
  common_beam_iters: 30
  common_beam_damping: 0.3
  rzf_regularization: null
  multiple_access: rsma
  rate_split_mode: simplex_scaled
  link_model: fbl
  fixed_success_prob: 0.8
  aoi_max: 1024
  aoi_cap_enabled: false
  aoi_init: one
  aoi_weights:
  - 1.0
  - 1.0
  scheduling_enabled: false
  power_scale_action: false
  allocator_mode: none
  allocator_common_gate: false
  allocator_cache_tol: 0.15
  allocator_seed: 0
  ack_mode: sampled
  reward_scale: 0.5
  lambda_power: 0.0
  lambda_tail: 0.0
  lambda_violation: 10.0
  aoi_tail_threshold: 10
  episode_length: 512
  obs_channel_mode: complex_flat
  obs_include_prev_action: true
  feasibility_tol: 1.0e-05

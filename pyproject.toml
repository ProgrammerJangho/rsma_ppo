[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsma-aoi"
version = "0.1.0"
description = "Constraint-preserving hybrid PPO for AoI minimization in finite-blocklength 1-layer RSMA MU-MISO downlink"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.1",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

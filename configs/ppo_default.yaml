# PPO hyper-parameters (rsma_aoi.utils.config.PPOConfig).
ppo:
  total_timesteps: 400000
  num_envs: 8
  rollout_steps: 256        # batch_size = num_envs * rollout_steps = 2048
  update_epochs: 10
  minibatch_size: 256       # must divide batch_size
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_value_loss: true
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 0.5
  learning_rate: 3.0e-4
  anneal_lr: true
  target_kl: 0.03           # null disables the early-stop guard
  normalize_advantage: true
  normalize_observation: true
  normalize_reward: false

  hidden_sizes: [128, 128]
  activation: tanh
  log_std_init: -0.5
  scalar_dist: beta         # beta | squashed_gaussian

  device: cpu
  log_interval: 1
  checkpoint_interval: 20
  eval_interval: 0
  eval_episodes: 10
  seed: 0

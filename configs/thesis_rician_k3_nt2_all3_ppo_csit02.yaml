# K=3, Nt=2 all-user PPO at the CEM-validated 20-degree, 15 dB regime.
# All label permutations preserve the physical geometry while preventing an
# actor from attaching common/private allocation to a fixed user index.
env:
  num_users: 3
  num_antennas: 2
  alpha: 0.8
  small_scale_model: rician_ula
  rician_k_db: 8.0
  user_angles_deg: [-10.0, 0.0, 10.0]
  user_angle_sets_deg:
    - [-10.0, 0.0, 10.0]
    - [-10.0, 10.0, 0.0]
    - [0.0, -10.0, 10.0]
    - [0.0, 10.0, -10.0]
    - [10.0, -10.0, 0.0]
    - [10.0, 0.0, -10.0]
  antenna_spacing_wavelength: 0.5
  csit_error_std: 0.2
  csit_error_mode: relative
  pathloss_model: homogeneous
  noise_power: 1.0
  snr_db: 15.0
  blocklength: 128
  payload_bits: 256.0
  private_beam: rzf
  common_beam: principal
  multiple_access: rsma
  rate_split_mode: simplex_scaled
  link_model: fbl
  scheduling_enabled: false
  allocator_mode: none
  power_scale_action: false
  aoi_init: one
  aoi_max: 1024
  aoi_cap_enabled: false
  episode_length: 512
  ack_mode: sampled
  aoi_weights: [1.0, 1.0, 1.0]
  reward_scale: 0.3333333333333333
  obs_channel_mode: gain_features
  obs_include_prev_action: true
  obs_include_snr: true
ppo:
  total_timesteps: 262144
  num_envs: 4
  rollout_steps: 128
  minibatch_size: 128
  update_epochs: 4
  hidden_sizes: [128, 128]
  learning_rate: 3.0e-4
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  normalize_observation: true
  normalize_reward: true
  scalar_dist: beta
  allocation_control: joint
  initial_common_power_fraction: 0.25
  initial_common_payload_scale: 0.05
  initial_scalar_concentration: 20.0
  common_gate_enabled: true
  initial_common_on_probability: 0.5
  device: cpu
  checkpoint_interval: 0
  eval_interval: 0

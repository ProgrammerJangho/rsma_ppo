env:
  num_users: 3
  num_antennas: 2
  alpha: 0.8
  small_scale_model: rician_ula
  rician_k_db: 8.0
  user_angles_deg: [-10.0, 0.0, 10.0]
  user_angle_sets_deg:
    - [-10.0, 0.0, 10.0]
    - [-10.0, 10.0, 0.0]
    - [0.0, -10.0, 10.0]
    - [0.0, 10.0, -10.0]
    - [10.0, -10.0, 0.0]
    - [10.0, 0.0, -10.0]
  antenna_spacing_wavelength: 0.5
  csit_error_std: 0.2
  csit_error_mode: relative
  pathloss_model: homogeneous
  noise_power: 1.0
  snr_db: 15.0
  blocklength: 128
  payload_bits: 256.0
  private_beam: rzf
  common_beam: principal
  multiple_access: rsma
  rate_split_mode: per_user_fraction
  link_model: fbl
  scheduling_enabled: false
  allocator_mode: none
  power_scale_action: false
  aoi_init: one
  aoi_max: 1024
  aoi_cap_enabled: false
  episode_length: 2048
  ack_mode: sampled
  aoi_weights: [1.0, 1.0, 1.0]
  reward_scale: 0.3333333333333333
  obs_channel_mode: gain_features
  obs_include_prev_action: true
  obs_include_snr: true

evaluation:
  protocol_version: 1
  eval_seeds: [990000, 990001, 990002, 990003, 990004, 990005]
  episode_steps: 2048
  burn_in: 512
  deterministic: true
  paired_reference: ppo_direct
  cem:
    iterations: 5
    population: 192
    restarts: 1
    evaluations_per_solve: 960
  checkpoint_groups:
    objective_warm_direct:
      expected_allocation_control: joint
      expected_common_gate: false
      checkpoints:
        - training_seed: 0
          path: runs/objective_actor_k3_nt2_all3_direct_seed0_v1/checkpoint.pt
        - training_seed: 1
          path: runs/objective_actor_k3_nt2_all3_direct_seed1_v1/checkpoint.pt
        - training_seed: 2
          path: runs/objective_actor_k3_nt2_all3_direct_seed2_v1/checkpoint.pt
    ppo_direct:
      expected_allocation_control: joint
      expected_common_gate: false
      checkpoints:
        - training_seed: 0
          path: runs/ppo_k3_nt2_all3_direct_seed0_262k_v1/checkpoint.pt
        - training_seed: 1
          path: runs/ppo_k3_nt2_all3_direct_seed1_262k_v1/checkpoint.pt
        - training_seed: 2
          path: runs/ppo_k3_nt2_all3_direct_seed2_262k_v1/checkpoint.pt
